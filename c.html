<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- It may read only its own list (lab-data.json, beside it) and send
     nothing anywhere: no other site, no forms, no frames. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Safety card</title>
<!--
  The safety card a phone shows after scanning the QR code on a chemical
  label. This is all that is published: the chemical's details travel inside
  the QR code itself, after the "#", which a phone never sends to the web
  server. Nothing else of the program, and nothing of any school, is here.
-->
<style>
:root { color-scheme: dark; --ink: #0d2430; --ink-soft: #46626b; --teal: #0d7f88; --danger: #b3271a; --warn: #8a5000;
  --on-dark: #f2f7f9; --on-dark-soft: rgba(238, 247, 249, .78); }
/* The look of the program's simple view: a deep teal ground, white type on
   it, a glass search bar, and each chemical on a white card. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #0d3b5c; }
body { margin: 0; min-height: 100vh; color: var(--ink);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(1100px 620px at 8% -8%, rgba(44, 198, 192, .42), transparent 62%),
              radial-gradient(900px 700px at 105% 4%, rgba(107, 87, 214, .32), transparent 60%),
              linear-gradient(165deg, #0f5664 0%, #0d3b5c 52%, #172552 100%);
  background-attachment: fixed;
  /* Fitted to the device that scanned it, clear of the notch and rounded corners. */
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
    max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
@media (max-width: 420px) {
  body { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
}
.wrap { max-width: 640px; margin: 0 auto; }
.wrap.is-list { max-width: 1120px; }

/* The safety card. */
.head, .sec { background: #fff; border: 1px solid rgba(255, 255, 255, .6); border-radius: 16px; padding: 15px 17px;
  margin-bottom: 12px; box-shadow: 0 10px 28px rgba(5, 14, 38, .22); }
.head h1 { margin: 0; font-size: 25px; line-height: 1.15; }
.formula { margin-top: 4px; font-size: 17px; color: var(--ink-soft); }
.formula sub, .ids sub { font-size: .72em; vertical-align: -.25em; }
.formula sup, .ids sup { font-size: .72em; vertical-align: .45em; }
.cas { margin-top: 2px; font-size: 14px; color: var(--ink-soft); }
.signal { border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; font-size: 21px; font-weight: 800;
  letter-spacing: .06em; text-align: center; color: #fff; background: #9a5b00; }
.signal.danger { background: #c0392b; }
.pics { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 12px; }
.pic { width: 84px; height: 84px; display: block; }
.pic svg { width: 100%; height: 100%; display: block; }
.sec h2 { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
.sec ul { margin: 0; padding-left: 20px; } .sec li { margin-bottom: 5px; } .sec p { margin: 0; }
.sec p + p { margin-top: 6px; }
.apart { margin-top: 8px; color: #c0392b; font-weight: 600; }
.dgs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dg-art { width: 64px; height: 64px; } .dg-art svg, .dg-art img { width: 100%; height: 100%; display: block; }
.dg { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #e4efef; color: #0e565c; font-weight: 700; }
.foot { font-size: 13px; color: var(--on-dark-soft); text-align: center; margin: 20px 4px 0; line-height: 1.5; }
.foot b { color: var(--on-dark); }
.plain { text-align: center; padding: 30px 18px; }
.back { display: inline-block; margin-bottom: 12px; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .5);
  background: #fff; font: inherit; font-weight: 700; color: #0e565c; cursor: pointer; box-shadow: 0 6px 18px rgba(5, 14, 38, .2); }

/* The lists: the manifest, the equipment, a place. */
.list-head { margin: 4px 2px 10px; color: var(--on-dark); }
.list-head h1 { margin: 0 0 6px; font-size: 32px; line-height: 1.12; letter-spacing: -.02em; text-shadow: 0 2px 18px rgba(6, 14, 34, .45); }
.list-head p { margin: 0; color: var(--on-dark-soft); font-size: 15.5px; max-width: 62ch; }
/* The search stays at the top as the list scrolls. */
.search { position: sticky; top: 0; z-index: 3; margin: 0 -8px 6px; padding: 10px 8px 10px;
  background: linear-gradient(180deg, rgba(13, 59, 92, .94), rgba(13, 59, 92, .82));
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 0 0 18px 18px; }
.sbox { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; border-radius: 999px;
  background: linear-gradient(142deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .12));
  border: 1px solid rgba(255, 255, 255, .34); border-top-color: rgba(255, 255, 255, .72);
  box-shadow: 0 14px 34px rgba(5, 14, 38, .26), inset 0 1px 0 rgba(255, 255, 255, .5); color: var(--on-dark); }
.sbox:focus-within { border-color: rgba(140, 240, 244, .75); box-shadow: 0 14px 34px rgba(5, 14, 38, .3), 0 0 0 3px rgba(111, 227, 232, .26); }
.sbox svg { flex: 0 0 auto; width: 21px; height: 21px; fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 1.9; stroke-linecap: round; }
.sbox input { flex: 1 1 auto; min-width: 0; min-height: 56px; border: 0; background: none; font: inherit; font-size: 17px; color: #fff; }
.sbox input::placeholder { color: rgba(255, 255, 255, .62); }
.sbox input:focus { outline: none; }
.sbox input::-webkit-search-cancel-button { display: none; }
.qclear { flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 999px; cursor: pointer;
  background: rgba(255, 255, 255, .18); color: #fff; font-size: 18px; line-height: 1; }
/* The storage area: every store, cabinet and shelf. */
.area { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.area label { flex: 0 0 auto; font-size: 14.5px; font-weight: 700; color: var(--on-dark); }
.area select { flex: 1; min-width: 0; padding: 11px 14px; border: 0; border-radius: 14px; font: inherit; font-size: 16px;
  background: #fff; color: var(--ink); box-shadow: 0 8px 22px rgba(5, 14, 38, .22); }
.area select:focus { outline: 3px solid rgba(111, 227, 232, .6); }
.count { margin: 4px 4px 10px; font-size: 14.5px; color: var(--on-dark-soft); }
.count.ask { font-size: 16px; color: var(--on-dark); }
.items { display: grid; gap: 10px; }
.section-title { margin: 18px 4px 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--on-dark-soft); }

/* One chemical: as a row of the simple view's manifest. */
.item { display: block; width: 100%; box-sizing: border-box; text-align: left; background: #fff; border: 0;
  border-left: 5px solid #1f8a5b; border-radius: 14px; padding: 14px 16px 14px 14px; font: inherit; color: inherit;
  box-shadow: 0 10px 26px rgba(5, 14, 38, .22); }
.item.st-out { border-left-color: #8a9aa1; } .item.st-order { border-left-color: #b0701a; } .item.st-waste { border-left-color: #7a4a2e; }
.item.equip { border-left-color: #2f6fe0; }
button.item { cursor: pointer; }
button.item:active, button.item:focus-visible { outline: 3px solid rgba(111, 227, 232, .8); outline-offset: 1px; }
.item .nm { display: block; font-size: 19px; font-weight: 700; line-height: 1.25; }
.item .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; font-size: 13.5px; color: var(--ink-soft); }
.sig { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; }
.sig.danger { background: rgba(179, 39, 26, .13); color: var(--danger); }
.sig.warning { background: rgba(138, 80, 0, .14); color: var(--warn); }
.sig.none { background: rgba(15, 45, 60, .09); color: var(--ink-soft); }
.gpics { display: inline-flex; gap: 4px; }
.gpics span { width: 30px; height: 30px; display: block; }
.gpics svg { width: 100%; height: 100%; display: block; }
.cells { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 12px; }
.cell { display: block; min-width: 0; }
.ch { display: block; margin-bottom: 2px; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #6a7c85; }
.cv { display: block; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.cell.loc .cv { color: var(--teal); font-weight: 650; }
.loose { color: #8a6d2f; font-weight: 500; }
.k-haz { color: var(--danger); } .k-safe { color: #1f7a3d; } .k-unknown { color: #5b6b74; }
.stock { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: rgba(31, 138, 91, .12); color: #146b45; }
.stock.st-out, .stock.st-waste { background: #eceff1; color: #5d6b70; } .stock.st-order { background: #fff1d6; color: #7a4b00; }
.note { display: block; margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
/* Wider screens: each chemical across one row, like the program's register. */
/* Large everywhere: it is read on a phone, standing at a cupboard. One
   column, each detail under the one before. */
body { font-size: 17px; }
.list-head h1 { font-size: 36px; }
.list-head p { font-size: 17px; }
.sbox input { font-size: 19px; min-height: 60px; }
.sbox svg { width: 23px; height: 23px; }
.area label { font-size: 16px; }
.area select { font-size: 17px; padding: 12px 14px; }
.count { font-size: 17px; }
.count.ask { font-size: 18px; }
.item { padding: 16px 18px 16px 16px; }
.item .nm { font-size: 23px; }
.item .meta { font-size: 16px; gap: 8px 12px; }
.sig { font-size: 13px; padding: 3px 12px; }
.gpics span { width: 38px; height: 38px; }
.cells { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 14px; }
.ch { font-size: 12.5px; }
.cv { font-size: 19px; }
.stock { font-size: 15px; padding: 3px 12px; }
.head h1 { font-size: 28px; }
.sec { font-size: 17px; }
.foot { font-size: 14px; }
/* A wide screen (a laptop, a large tablet held sideways): the search and the
   storage area side by side, and each chemical across one row. Set by the
   page's own measure of the screen (fitScreen), not the browser's. */
.is-wide .is-list .search { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: center; }
.is-wide .is-list .area { margin-top: 0; }
.is-wide .item.chem { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 3.5fr); gap: 18px; align-items: start; }
.is-wide .item.chem .cells { grid-template-columns: minmax(0, .9fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .8fr); margin-top: 2px; }
.is-wide .item.equip .cells { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.is-wide .list-head h1 { font-size: 40px; }
@media print { body { background: #fff; } .head, .sec { border-color: #999; box-shadow: none; } .foot { color: #444; } }
</style>
</head>

function escapeHtml(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// The same reading of a code, and the same chemical formulae, as the program that printed it.
var CARD_FIELDS = ["n", "c", "f", "a", "s", "h", "p", "d", "k", "x", "i"];
var CARD_LISTS = { h: 1, p: 1, d: 1, k: 1 };
var CARD_SEP = "";
function cardChecksum(text) {
  var h = 0x811c9dc5;
  for (var i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36);
}

function decodeCard(text) {
  try {
    var b64 = String(text).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var raw = decodeURIComponent(escape(atob(b64)));
    var cut = raw.indexOf(CARD_SEP);
    if (cut < 1) return null;
    var sum = raw.slice(0, cut), body = raw.slice(cut + 1);
    if (sum !== cardChecksum(body)) return null;

    var parts = body.split(CARD_SEP);
    var out = {};
    CARD_FIELDS.forEach(function (key, i) {
      var value = parts[i] === undefined ? "" : parts[i];
      out[key] = CARD_LISTS[key] ? (value ? value.split(",") : []) : value;
    });
    return out.n || out.f || out.a ? out : null;
  } catch (e) { return null; }
}


var Formula = (function () {
  var SUBSCRIPT_AFTER = /[a-zA-Z)\]}]/;
  var SEPARATORS = /[•·.;,/ \t]/;
  var LONE_SYMBOL = /^[A-Z][a-z]{0,2}$/;

  function isCharge(token) { return LONE_SYMBOL.test(token); }

  function parse(text) {
    var runs = [];
    var index = 0, length = text.length, previous = "", tokenStart = 0;

    function emit(kind, chunk) {
      if (!chunk) return;
      var last = runs[runs.length - 1];
      if (last && last[0] === kind) last[1] += chunk;
      else runs.push([kind, chunk]);
    }

    while (index < length) {
      var ch = text[index];

      if (ch === "_" || ch === "^") {
        var kind = ch === "_" ? "sub" : "sup";
        index++;
        if (index < length && text[index] === "{") {
          var end = text.indexOf("}", index);
          if (end === -1) end = length;
          emit(kind, text.slice(index + 1, end));
          index = end < length ? end + 1 : length;
        } else {
          var run = "";
          while (index < length && (/[a-zA-Z0-9]/.test(text[index]) || text[index] === "+" || text[index] === "-")) {
            run += text[index]; index++;
          }
          emit(kind, run);
        }
        previous = "";
        continue;
      }

      if (/\d/.test(ch)) {
        var m = /^\d+/.exec(text.slice(index));
        var digits = m[0];
        var afterPos = index + digits.length;
        var after = text[afterPos] || "";
        var charge = (after === "+" || after === "-") && isCharge(text.slice(tokenStart, index));
        if (charge) {
          emit("sup", digits + after);
          index = afterPos + 1;
          previous = after;
        } else if (SUBSCRIPT_AFTER.test(previous)) {
          emit("sub", digits);
          index = afterPos;
          previous = digits[digits.length - 1];
        } else {
          emit("base", digits);
          index = afterPos;
          previous = digits[digits.length - 1];
        }
        continue;
      }

      if ((ch === "+" || ch === "-") && (SUBSCRIPT_AFTER.test(previous) || /\d/.test(previous))) {
        emit("sup", ch);
        index++; previous = ch;
        continue;
      }

      emit("base", ch);
      previous = ch;
      index++;
      if (SEPARATORS.test(ch)) tokenStart = index;
    }
    return runs;
  }

  function toHtml(text) {
    if (!text) return "";
    return parse(text).map(function (run) {
      var kind = run[0], chunk = escapeHtml(run[1]);
      if (kind === "sub") return "<sub>" + chunk + "</sub>";
      if (kind === "sup") return "<sup>" + chunk + "</sup>";
      return chunk;
    }).join("");
  }

  return { parse: parse, toHtml: toHtml };
})();


function section(title, body) { return body ? '<div class="sec"><h2>' + title + "</h2>" + body + "</div>" : ""; }

function show(data) {
  var names = CARD_DATA.dgClassNames, locations = CARD_DATA.storageLocation;
  var pics = (data.p || []).map(function (code) { return '<span class="pic">' + (PICTOGRAM_SVG[code] || "") + "</span>"; }).join("");
  var hazards = (data.h || []).map(function (code) {
    var text = CARD_DATA.hazardStatements[code];
    return "<li>" + escapeHtml(code + (text ? ": " + text : "")) + "</li>";
  }).join("");
  var dgs = (data.d || []).map(function (cls) {
    return (DG_PLACARDS[cls] ? '<span class="dg-art">' + DG_PLACARDS[cls] + "</span>" : "")
      + '<span class="dg">' + escapeHtml("Class " + cls + (names[cls] ? " — " + names[cls] : "")) + "</span>";
  }).join("");
  var where = "";
  (data.d || []).some(function (cls) { if (locations[cls]) { where = locations[cls]; return true; } return false; });
  var title = (data.n || "Chemical") + (data.c ? " " + data.c : "");
  document.title = title + " — safety card";
  document.getElementById("card").className = "wrap is-card";
  document.getElementById("card").innerHTML =
    '<div class="head"><h1>' + escapeHtml(title) + "</h1>"
    + (data.f ? '<div class="formula">' + Formula.toHtml(data.f) + "</div>" : "")
    + ((data.a || data.i) ? '<div class="cas">' + escapeHtml([data.a ? "CAS " + data.a : "", data.i ? "IUPAC: " + data.i : ""]
        .filter(Boolean).join("  ·  ")) + "</div>" : "")
    + "</div>"
    + (data.s ? '<div class="signal' + (data.s.toLowerCase() === "danger" ? " danger" : "") + '">' + escapeHtml(data.s.toUpperCase()) + "</div>" : "")
    + (pics ? '<div class="pics">' + pics + "</div>" : "")
    + section("Hazards", hazards ? "<ul>" + hazards + "</ul>" : "")
    + section("Dangerous goods class", dgs ? '<div class="dgs">' + dgs + "</div>" : "")
    + section("Storage", (where ? "<p>" + escapeHtml(where) + "</p>" : "")
        + ((data.k || []).length ? '<p class="apart">Keep apart from class ' + escapeHtml(data.k.join(", ")) + "</p>" : ""))
    + section("Also on the label", data.x ? "<p>" + escapeHtml(data.x) + "</p>" : "")
    + '<p class="foot">From the label on this container. It is not a substitute for the safety data sheet: '
    + "check the SDS before using the chemical.</p>";
}

/* -- The lists: opened with the key a QR code carries, searched as the program searches -- */
function smartWords(text) {
  return String(text || "").toLowerCase().replace(/sulph/g, "sulf")
    .replace(/[^a-z0-9.%]+/g, " ").trim().split(" ").filter(Boolean);
}
/* A word's stem: "heating", "heated", "heater", "heats" all "heat". */
function smartStem(w) {
  if (w.length > 5) w = w.replace(/(?:ing|ers|er|ed|es)$/, "");
  if (w.length > 3) w = w.replace(/s$/, "");
  return w;
}
/* How many single changes turn one word into the other, swapped letters
   counting as one. Gives up past `max`. */
function smartDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  var prev2 = null, prev = [], cur;
  for (var j = 0; j <= b.length; j++) prev[j] = j;
  for (var i = 1; i <= a.length; i++) {
    cur = [i];
    var best = i;
    for (var k = 1; k <= b.length; k++) {
      var cost = a[i - 1] === b[k - 1] ? 0 : 1;
      var v = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + cost);
      if (prev2 && i > 1 && k > 1 && a[i - 1] === b[k - 2] && a[i - 2] === b[k - 1]) v = Math.min(v, prev2[k - 2] + 1);
      cur[k] = v;
      if (v < best) best = v;
    }
    if (best > max) return max + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}
/* How well one typed word matches one word of the item: 0 is not at all. */
function smartWordScore(q, t) {
  if (q === t) return 4;
  var qs = smartStem(q), ts = smartStem(t);
  if (qs === ts) return 3.5;
  if (q.length >= 2 && t.indexOf(q) === 0) return 3;        // still being typed
  if (qs.length >= 3 && (t.indexOf(qs) === 0 || ts.indexOf(qs) === 0 || qs.indexOf(ts) === 0 && ts.length >= 4)) return 2.5;
  if (q.length >= 3 && t.indexOf(q) !== -1) return 2;
  // A misspelling: judged on the whole words, as stems can look alike
  // ("beak", "heat"); two slips allowed only in a long word.
  if (q.length >= 4 && !/\d/.test(q)) {
    var allow = q.length >= 9 ? 2 : 1;
    if (smartDistance(q, t, allow) <= allow) return 1.5;
  }
  return 0;
}
/* The items that match, best first. `textOf(item)` is the words to search;
   `weightOf`, if given, says which words count most (e.g. the name). */
function smartSearch(items, query, textOf) {
  var qWords = smartWords(query);
  if (!qWords.length) return [];
  var scored = [];
  items.forEach(function (item, at) {
    var words = smartWords(textOf(item));
    var total = 0, matched = 0;
    qWords.forEach(function (q) {
      var best = 0;
      for (var i = 0; i < words.length && best < 4; i++) {
        var s = smartWordScore(q, words[i]);
        if (s > best) best = s;
      }
      if (best) { total += best; matched++; }
    });
    if (!matched) return;
    // Every word matched counts most; then how closely; then shorter names.
    scored.push({ item: item, rank: (matched === qWords.length ? 100 : 0) + matched * 10 + total, at: at,
                  all: matched === qWords.length });
  });
  // With a whole match to show, the matches on one word of several are left out.
  var anyAll = scored.some(function (x) { return x.all; });
  if (anyAll && qWords.length > 1) scored = scored.filter(function (x) { return x.all; });
  scored.sort(function (a, b) { return b.rank - a.rank || a.at - b.at; });
  return scored.map(function (x) { return x.item; });
}


/* Some phone browsers lay a page out as if on a wide screen ("desktop
   site") and shrink it to fit, so everything comes out tiny. The page
   measures the screen itself: on a touch screen laid out wider than it
   really is, it enlarges itself to the true width; and it marks itself wide
   only when the screen truly is. */
function fitScreen() {
  var html = document.documentElement, zoom = 1;
  try {
    var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    var real = window.screen && screen.width ? screen.width : window.innerWidth;
    if (touch && real < 900 && window.innerWidth > real * 1.25) zoom = window.innerWidth / real;
  } catch (e) {}
  html.style.zoom = zoom > 1 ? zoom.toFixed(3) : "";
  html.classList.toggle("is-wide", window.innerWidth / zoom >= 1000);
}
fitScreen();
window.addEventListener("resize", fitScreen);
window.addEventListener("orientationchange", function () { setTimeout(fitScreen, 250); });

var LIST = null, VIEW = { v: "chem", p: "", q: "", area: "" };
var NO_PLACE = "__none__";   // the drop-down's "Not in a storage place yet"
var STOCK_WORDS = { "in": "In stock", out: "Not in stock", order: "To order", waste: "Waste" };
var KIND_WORDS = { haz: "Hazardous", safe: "Non-hazardous", unknown: "Not confirmed" };
function fromB64u(text) {
  var b64 = String(text).replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  var raw = atob(b64), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function message(title, text) {
  document.getElementById("card").className = "wrap";
  document.getElementById("card").innerHTML = '<div class="head plain"><h1>' + escapeHtml(title) + "</h1><p>" + escapeHtml(text) + "</p></div>";
}
async function openList(key) {
  message("Opening the list…", "");
  var file;
  try {
    var res = await fetch(new URL("lab-data.json", location.href).href, { cache: "no-store" });
    if (!res.ok) throw new Error("missing");
    file = await res.json();
  } catch (e) {
    message("The list is not here yet", "The laboratory has not put the list on this site yet. Ask the laboratory.");
    return;
  }
  try {
    var k = await crypto.subtle.importKey("raw", fromB64u(key), "AES-GCM", false, ["decrypt"]);
    var bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64u(file.iv) }, k, fromB64u(file.data)));
    if (file.z) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
    LIST = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) {
    message("This code does not open the list", "It may be from an older set of codes. Ask the laboratory for a new one.");
    return;
  }
  drawList(true);
}
function chemText(c) { return [c.n, c.f, c.a, c.d ? "class " + c.d : "", (c.w || []).join(" ")].join(" "); }
function equipText(e) { return [e.n, e.c, e.w, e.m].join(" "); }
function inPlace(where) { return inPlaceOf(VIEW.p); }
/* A place, or anywhere inside it (a cabinet in a store, a shelf in a cabinet). */
function inPlaceOf(place) {
  var p = String(place || "").toLowerCase();
  return function (w) { return String(w || "").toLowerCase() === p || String(w || "").toLowerCase().indexOf(p + " › ") === 0; };
}
function inArea(area, places) {
  if (!area) return true;
  places = [].concat(places || []).filter(Boolean);
  return area === NO_PLACE ? !places.length : places.some(inPlaceOf(area));
}
/* The drop-down: Everywhere, each place indented under the one it is in,
   with how many there are, and the ones in no place. */
function areaOptions(items, placesOf) {
  var opts = '<option value="">Everywhere (' + items.length + ")</option>";
  (LIST.places || []).forEach(function (pl) {
    var n = items.filter(function (it) { return inArea(pl, placesOf(it)); }).length;
    if (!n) return;
    var depth = pl.split(" › ").length - 1;
    opts += '<option value="' + escapeHtml(pl) + '">' + new Array(depth + 1).join(" ")
      + escapeHtml(pl.split(" › ").pop()) + " (" + n + ")</option>";
  });
  var none = items.filter(function (it) { return ![].concat(placesOf(it) || []).filter(Boolean).length; }).length;
  if (none) opts += '<option value="' + NO_PLACE + '">Not in a storage place yet (' + none + ")</option>";
  return opts;
}
/* A chemical's safety card, read once from the code stored with it: its
   signal word and pictograms for the list. */
var CARD_CACHE = {};
function cardOf(c) {
  if (!(c._i in CARD_CACHE)) CARD_CACHE[c._i] = (c.c && decodeCard(c.c)) || {};
  return CARD_CACHE[c._i];
}
function cell(head, html, cls) {
  return '<span class="cell' + (cls ? " " + cls : "") + '"><span class="ch">' + head + '</span><span class="cv">' + html + "</span></span>";
}
/* One chemical, as a row of the program's simple-view manifest. */
function chemRow(c, i) {
  var card = cardOf(c), sig = String(card.s || "").trim();
  var tone = /danger/i.test(sig) ? "danger" : /warning/i.test(sig) ? "warning" : "none";
  var pics = (card.p || []).map(function (code) {
    return PICTOGRAM_SVG[code] ? "<span>" + PICTOGRAM_SVG[code] + "</span>" : "";
  }).join("");
  var ids = [c.f ? Formula.toHtml(c.f) : "", c.a ? "CAS " + escapeHtml(c.a) : ""].filter(Boolean).join(" · ");
  var word = sig || (c.h === "safe" ? "Not hazardous" : "");
  return '<button type="button" class="item chem st-' + escapeHtml(c.st || "in") + '" data-chem="' + i + '">'
    + '<span class="who"><span class="nm">' + escapeHtml(c.n) + "</span>"
    + '<span class="meta">' + (word ? '<span class="sig ' + tone + '">' + escapeHtml(word) + "</span>" : "")
    + (ids ? '<span class="ids">' + ids + "</span>" : "")
    + (pics ? '<span class="gpics">' + pics + "</span>" : "") + "</span></span>"
    + '<span class="cells">'
    + cell("Quantity", escapeHtml(c.q || "—"))
    + cell("Classification", "DG: <b>" + escapeHtml(c.d ? c.d + (c.g ? " " + c.g : "") : "—") + '</b><br>GHS: <b class="k-' + escapeHtml(c.h || "unknown") + '">'
      + escapeHtml(KIND_WORDS[c.h] || "Not confirmed") + "</b>")
    + cell("Location", (c.w || []).length ? escapeHtml(c.w.join("; ")) : '<span class="loose">Not in a storage place yet</span>', "loc")
    + cell("Stock", '<span class="stock st-' + escapeHtml(c.st || "in") + '">' + escapeHtml(STOCK_WORDS[c.st] || "In stock") + "</span>")
    + "</span></button>";
}
function equipRow(e) {
  return '<div class="item equip"><span class="nm">' + escapeHtml(e.n) + "</span>"
    + '<span class="cells">' + cell("Quantity", escapeHtml(e.q || "—"))
    + cell("Location", e.w ? escapeHtml(e.w) : '<span class="loose">Not in a storage place yet</span>', "loc")
    + cell("Category", escapeHtml(e.c || "—")) + "</span>"
    + (e.m ? '<span class="note">' + escapeHtml(e.m) + "</span>" : "") + "</div>";
}
function drawList(first) {
  var title = VIEW.v === "equip" ? "Equipment" : VIEW.v === "place" ? VIEW.p : "Chemical Manifest";
  document.title = title;
  var chems = LIST.chemicals.map(function (c, i) { c._i = i; return c; }), equip = LIST.equipment.slice();
  if (VIEW.v === "place") {
    chems = chems.filter(function (c) { return (c.w || []).some(inPlace()); });
    equip = equip.filter(function (e) { return inPlace()(e.w); });
  }
  var showChems = VIEW.v !== "equip", showEquip = VIEW.v !== "chem";
  var allChems = chems, allEquip = equip;
  if (VIEW.v !== "place" && VIEW.area) {
    chems = chems.filter(function (c) { return inArea(VIEW.area, c.w); });
    equip = equip.filter(function (e) { return inArea(VIEW.area, e.w); });
  }
  if (VIEW.q.trim()) {
    chems = smartSearch(chems, VIEW.q, chemText);
    equip = smartSearch(equip, VIEW.q, equipText);
  } else {
    chems.sort(function (a, b) { return a.n.localeCompare(b.n); });
    equip.sort(function (a, b) { return a.n.localeCompare(b.n); });
  }
  // The whole manifest waits for a question: a search, or a storage area.
  // A cupboard's own code shows what is in it straight away.
  var asked = VIEW.v === "place" || !!VIEW.q.trim() || !!VIEW.area;
  var CAP = 200, html = "";
  if (asked && showChems) {
    if (VIEW.v === "place") html += '<p class="section-title">Chemicals (' + chems.length + ")</p>";
    html += '<div class="items">' + chems.slice(0, CAP).map(function (c) { return chemRow(c, c._i); }).join("") + "</div>";
  }
  if (asked && showEquip) {
    if (VIEW.v === "place") html += '<p class="section-title">Equipment (' + equip.length + ")</p>";
    html += '<div class="items">' + equip.slice(0, CAP).map(equipRow).join("") + "</div>";
  }
  var n = (showChems ? chems.length : 0) + (showEquip ? equip.length : 0);
  var when = new Date(LIST.published);
  if (first) {
    var card = document.getElementById("card");
    card.className = "wrap is-list";
    card.innerHTML = '<div class="list-head"><h1>' + escapeHtml(title) + "</h1><p>"
      + (VIEW.v === "chem" ? "Search the manifest by name, formula or CAS number, or choose a storage area. Tap a chemical for its safety card."
        : VIEW.v === "equip" ? "Search the equipment by name, or choose a storage area."
        : "What is kept here. Tap a chemical for its safety card.")
      + '</p></div><div class="search"><label class="sbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/>'
      + '<path d="M16 16l4.5 4.5"/></svg><input type="search" id="q" placeholder="'
      + (VIEW.v === "equip" ? "Search, e.g. beaker" : "Search by name, formula or CAS")
      + '" aria-label="Search" autocomplete="off" enterkeyhint="search"><button type="button" class="qclear" id="qclear" '
      + 'aria-label="Clear the search" hidden>×</button></label>'
      + (VIEW.v !== "place" ? '<div class="area"><label for="area">Storage area</label><select id="area">'
        + (VIEW.v === "equip" ? areaOptions(allEquip, function (e) { return e.w; }) : areaOptions(allChems, function (c) { return c.w; }))
        + "</select></div>" : "")
      + '</div><p class="count" id="count"></p><div id="results"></div>'
      + '<p class="foot">As the laboratory’s records were on ' + escapeHtml(isNaN(when.getTime()) ? "the day it was published"
        : when.toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" }))
      + ". Check the safety data sheet before using a chemical.<br><b>This page never asks you to sign in or for a "
      + "password.</b> If it ever does, do not: tell the laboratory.<br>QR page version 29 Oct 2026 15:56</p>";
    var q = document.getElementById("q"), clear = document.getElementById("qclear");
    q.value = VIEW.q;
    clear.hidden = !VIEW.q;
    q.addEventListener("input", function () { VIEW.q = q.value; clear.hidden = !q.value; drawList(false); });
    clear.addEventListener("click", function () { q.value = ""; VIEW.q = ""; clear.hidden = true; drawList(false); q.focus(); });
    var area = document.getElementById("area");
    if (area) {
      area.value = VIEW.area;
      if (area.value !== VIEW.area) VIEW.area = "";
      area.addEventListener("change", function () { VIEW.area = area.value; drawList(false); window.scrollTo(0, 0); });
    }
  }
  var count = document.getElementById("count");
  count.classList.toggle("ask", !asked);
  if (!asked) {
    count.textContent = VIEW.v === "equip" ? "Type a name, or choose a storage area."
      : "Type a name, formula or CAS number, or choose a storage area.";
  } else {
    var areaName = !VIEW.area ? "" : VIEW.area === NO_PLACE ? " not in a storage place" : " in " + VIEW.area;
    count.textContent = (n ? n + " found" : "Nothing found") + areaName
      + (n > CAP ? " (the first " + CAP + " are shown: search to narrow it)" : "");
  }
  document.getElementById("results").innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll("[data-chem]"), function (b) {
    b.addEventListener("click", function () { openChem(LIST.chemicals[+b.getAttribute("data-chem")]); });
  });
}
function openChem(c) {
  var data = decodeCard(c.c);
  var top = window.scrollY;
  show(data || { n: c.n, h: [], p: [], d: [], k: [], x: "The safety card for this chemical could not be read." });
  // Where this one is kept, above the general storage advice.
  var kept = document.createElement("div");
  kept.className = "sec";
  kept.innerHTML = "<h2>Where it is kept here</h2><p>" + escapeHtml((c.w || []).length ? c.w.join("; ")
    : "Not in a storage place yet") + "</p>" + (c.q ? "<p>Quantity: " + escapeHtml(c.q) + "</p>" : "");
  var card = document.getElementById("card"), heads = card.querySelectorAll(".sec");
  card.insertBefore(kept, heads.length ? heads[0] : card.querySelector(".foot"));
  var back = document.createElement("button");
  back.type = "button"; back.className = "back"; back.textContent = "‹ Back to the list";
  back.addEventListener("click", function () { drawList(true); window.scrollTo(0, top); });
  document.getElementById("card").insertBefore(back, document.getElementById("card").firstChild);
  window.scrollTo(0, 0);
}

(function () {
  var hash = location.hash || "";
  var key = /[#&]m=([A-Za-z0-9\-_]+)/.exec(hash);
  if (key) {
    var v = /[#&]v=(chem|equip|place)/.exec(hash), p = /[#&]p=([^&]*)/.exec(hash);
    VIEW.v = v ? v[1] : "chem";
    try { VIEW.p = p ? decodeURIComponent(p[1]) : ""; } catch (e) { VIEW.p = ""; }
    openList(key[1]);
    return;
  }
  var match = /[#&]card=([A-Za-z0-9\-_]+)/.exec(location.hash || "");
  if (!match) {
    document.getElementById("card").innerHTML = '<div class="head plain"><h1>Safety card</h1>'
      + "<p>Scan the QR code on a chemical’s label to see its safety card here.</p></div>";
    return;
  }
  var data = decodeCard(match[1]);
  if (!data) {
    show({ n: "Could not read this code", h: [], p: [], d: [], k: [],
      x: "The link was damaged or incomplete, so no chemical information could be recovered from it. "
        + "Read the printed label on the container and check the safety data sheet." });
    return;
  }
  show(data);
})();
